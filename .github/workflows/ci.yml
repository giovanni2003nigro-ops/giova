name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Supabase-Migrationen gegen Postgres (auf ubuntu-latest vorinstalliert) + Abgleich mit der App
      - run: npm run test:db
      - run: npm run build
